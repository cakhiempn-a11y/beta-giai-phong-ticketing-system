<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="posterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="50%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B20710"/>
    </linearGradient>
    <pattern id="filmHoles" width="12" height="24" patternUnits="userSpaceOnUse">
      <rect x="2" y="4" width="8" height="12" rx="2" fill="#0c0c0c" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="300" height="450" fill="url(#posterBg)" rx="6"/>

  <!-- Film strip perforations on left and right -->
  <rect x="0" y="0" width="12" height="450" fill="url(#filmHoles)"/>
  <rect x="288" y="0" width="12" height="450" fill="url(#filmHoles)"/>

  <!-- Inner Frame -->
  <rect x="18" y="14" width="264" height="422" fill="none" stroke="#333333" stroke-width="1.5" rx="4"/>
  <rect x="24" y="20" width="252" height="410" fill="none" stroke="#262626" stroke-width="1" rx="3"/>

  <!-- Top Brand Tag -->
  <rect x="105" y="32" width="90" height="22" rx="3" fill="url(#redAccent)"/>
  <text x="150" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BETA CINEMA</text>

  <!-- Cinema Reel / Projector Icon -->
  <g transform="translate(150, 195)" text-anchor="middle">
    <!-- Outer reel ring -->
    <circle r="56" fill="#1c1c1c" stroke="#444444" stroke-width="2"/>
    <circle r="50" fill="#141414" stroke="#333333" stroke-width="1.5"/>
    <circle r="42" fill="none" stroke="#E50914" stroke-width="1.5" opacity="0.6"/>

    <!-- Reel holes -->
    <circle cx="0" cy="-24" r="9" fill="#242424" stroke="#383838" stroke-width="1"/>
    <circle cx="21" cy="-12" r="9" fill="#242424" stroke="#383838" stroke-width="1"/>
    <circle cx="21" cy="12" r="9" fill="#242424" stroke="#383838" stroke-width="1"/>
    <circle cx="0" cy="24" r="9" fill="#242424" stroke="#383838" stroke-width="1"/>
    <circle cx="-21" cy="12" r="9" fill="#242424" stroke="#383838" stroke-width="1"/>
    <circle cx="-21" cy="-12" r="9" fill="#242424" stroke="#383838" stroke-width="1"/>

    <!-- Center hub -->
    <circle r="14" fill="#262626" stroke="#555555" stroke-width="1.5"/>
    <circle r="6" fill="#E50914"/>
  </g>

  <!-- Typography Labels -->
  <text x="150" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F5F5F1" text-anchor="middle" letter-spacing="1">TÁC PHẨM ĐIỆN ẢNH</text>
  <line x1="110" y1="310" x2="190" y2="310" stroke="#E50914" stroke-width="2" opacity="0.8"/>
  <text x="150" y="332" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#B3B3B3" text-anchor="middle">Beta Giải Phóng</text>
  <text x="150" y="352" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#777777" text-anchor="middle">Âm Thanh Sống Động • Chuẩn Quốc Tế</text>

  <!-- Footer Tagline -->
  <rect x="40" y="396" width="220" height="20" rx="2" fill="#181818" stroke="#2a2a2a" stroke-width="1"/>
  <text x="150" y="410" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#888888" text-anchor="middle" letter-spacing="0.5">LỊCH CHIẾU &amp; SƠ ĐỒ GHẾ THỜI GIAN THỰC</text>
</svg>
