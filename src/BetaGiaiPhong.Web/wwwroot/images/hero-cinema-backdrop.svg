<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="stageGlow" cx="70%" cy="30%" r="65%" fx="60%" fy="25%">
      <stop offset="0%" stop-color="#3d1217" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#240c10" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#141414" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090909" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="beam1" x1="100%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#E50914" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam2" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0%" y1="70%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414" stop-opacity="0"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="leftFade" x1="0%" y1="0%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#0e0e0e" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Deep Stage Base -->
  <rect width="1920" height="1080" fill="url(#stageGlow)"/>

  <!-- Theatrical Light Beams -->
  <polygon points="1500,0 1920,0 1300,1080 700,1080" fill="url(#beam1)"/>
  <polygon points="1200,0 1500,0 800,1080 300,1080" fill="url(#beam2)"/>

  <!-- Architectural Cinema Elements in Deep Silhouette -->
  <!-- Upper cinema screen curvature -->
  <path d="M 400,200 Q 1100,280 1800,200 L 1800,750 Q 1100,850 400,750 Z" fill="#0d0d0d" opacity="0.35"/>
  <path d="M 400,200 Q 1100,280 1800,200" fill="none" stroke="#E50914" stroke-width="2" opacity="0.3"/>

  <!-- Left Shadow Mask (ensures white text readability on left side) -->
  <rect width="1920" height="1080" fill="url(#leftFade)"/>

  <!-- Bottom seamless merge into page background #141414 -->
  <rect width="1920" height="1080" fill="url(#bottomFade)"/>
</svg>
